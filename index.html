<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Bouncy</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root {
  --bg: #000000; 
  --surface: #121212;
  --surface-light: #1C1C1E;
  --fg: #FFFFFF;
  --mute: #8E8E93;
  --line: #2C2C2E;
  --brand: #FF6B35;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: var(--font); }
body { background: var(--bg); color: var(--fg); height: 100dvh; width: 100vw; display: flex; justify-content: center; overflow: hidden; }
#app { width: 100%; max-width: 480px; height: 100dvh; display: flex; flex-direction: column; position: relative; background: var(--bg); overflow: hidden; }
.hide { display: none !important; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; transition: opacity 0.2s; }
button:active { opacity: 0.7; }
input, textarea { width: 100%; padding: 16px; border: 1px solid var(--line); background: var(--surface-light); color: var(--fg); border-radius: 8px; font-size: 16px; margin-bottom: 12px; outline: none; }
input:focus, textarea:focus { border-color: #555; }

.header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--bg); border-bottom: 1px solid var(--line); z-index: 10; }
.logo { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; display: flex; align-items: center; gap: 6px; }
.brand-dot { width: 10px; height: 10px; background: var(--brand); border-radius: 50%; }
.live-btn { background: var(--surface-light); padding: 6px 12px; border-radius: 8px; font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.live-dot { width: 8px; height: 8px; background: #FF3B30; border-radius: 50%; }

.nav-wrapper { background: var(--bg); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 20; }
nav { display: flex; justify-content: space-around; align-items: center; padding: 10px 0; }
nav button { color: var(--mute); display: flex; flex-direction: column; align-items: center; font-size: 10px; font-weight: 500; gap: 4px; flex: 1; }
nav button.on { color: var(--fg); }
nav button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
nav .plus-btn svg { width: 26px; height: 26px; }

.feed-container { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 100px; }
.post-card { background: var(--bg); border-bottom: 1px solid var(--line); padding-bottom: 16px; margin-bottom: 16px; }
.post-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--surface-light); border: 1px solid var(--line); display: grid; place-items: center; font-weight: 600; font-size: 16px; }
.post-meta b { display: block; font-size: 14px; }
.post-meta span { font-size: 12px; color: var(--mute); }
.post-image { width: 100%; border-radius: 4px; margin-top: 12px; object-fit: cover; max-height: 400px; border: 1px solid var(--line); }
.post-actions { display: flex; gap: 24px; margin-top: 16px; color: var(--fg); font-size: 14px; font-weight: 600; }

#feed { scroll-snap-type: y mandatory; overflow-y: auto; height: 100%; background: #000; }
.clip { height: 100dvh; scroll-snap-align: start; position: relative; display: flex; align-items: center; justify-content: center; }
.clip video { width: 100%; height: 100%; object-fit: contain; }
.clip-overlay { position: absolute; bottom: 90px; left: 16px; right: 80px; color: #fff; }
.clip-overlay b { font-size: 16px; display: block; margin-bottom: 6px; font-weight: 700; }
.clip-overlay p { font-size: 14px; line-height: 1.4; color: #ddd; }
.side-actions { position: absolute; right: 12px; bottom: 90px; display: flex; flex-direction: column; gap: 24px; align-items: center; color: #fff; }
.side-actions button { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; }
.side-actions svg { width: 28px; height: 28px; fill: #fff; }

.sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 50; display: none; opacity: 0; transition: opacity 0.3s; }
.sheet-overlay.open { display: block; opacity: 1; }
.sheet { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-radius: 16px 16px 0 0; padding: 24px 20px calc(24px + env(safe-area-inset-bottom)); z-index: 51; transform: translateY(100%); transition: transform 0.3s ease-out; max-height: 90vh; overflow-y: auto; }
.sheet.open { transform: translateY(0); }
.sheet-drag { width: 36px; height: 5px; background: #333; border-radius: 3px; margin: 0 auto 20px; }
.sheet h2 { font-size: 20px; font-weight: 700; margin-bottom: 16px; letter-spacing: -0.5px; }

.btn-primary { background: var(--fg); color: var(--bg); width: 100%; padding: 14px; border-radius: 8px; font-weight: 600; font-size: 16px; margin-top: 10px; }
.btn-secondary { background: transparent; border: 1px solid var(--line); color: var(--fg); width: 100%; padding: 14px; border-radius: 8px; font-weight: 600; font-size: 16px; margin-top: 10px; }

#camera-screen { position: fixed; inset: 0; background: #000; z-index: 100; display: none; flex-direction: column; }
#camera-screen.open { display: flex; }
#camera-preview { flex: 1; width: 100%; object-fit: cover; }
.camera-controls { position: absolute; bottom: 40px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; }
.record-btn { width: 72px; height: 72px; border-radius: 50%; border: 4px solid #fff; background: rgba(255, 255, 255, 0.3); display: flex; justify-content: center; align-items: center; padding: 0; }
.record-inner { width: 56px; height: 56px; border-radius: 50%; background: #FF3B30; transition: all 0.2s; }
.record-btn.recording .record-inner { width: 24px; height: 24px; border-radius: 4px; }
.camera-close { position: absolute; top: 40px; left: 20px; color: #fff; font-size: 32px; font-weight: 300; }
</style>
</head>
<body>

<div id="app" class="watch">
  <header class="header hide" id="main-header">
    <div class="logo">Bouncy <div class="brand-dot"></div></div>
    <button class="live-btn" onclick="openLive()"><div class="live-dot"></div> LIVE</button>
  </header>

  <main style="flex: 1; position: relative; overflow: hidden;">
    <div id="feed" class="hide" style="height:100%;"></div>
    <div id="trend" class="hide" style="height:100%; overflow-y:auto;"></div>
    <div id="me" class="hide" style="height:100%; overflow-y:auto;"></div>
  </main>

  <div class="nav-wrapper hide" id="main-nav">
    <nav>
      <button data-v="feed" class="on" onclick="switchTab('feed')">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        Watch
      </button>
      <button data-v="trend" onclick="switchTab('trend')">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        Explore
      </button>
      <button class="plus-btn" onclick="openCamera()">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button onclick="openChats()">
        <svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>
        Chats
      </button>
      <button data-v="me" onclick="switchTab('me')">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/></svg>
        Me
      </button>
    </nav>
  </div>
</div>

<div class="sheet-overlay" id="sheet-overlay" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-drag"></div>
  <div id="sheet-content"></div>
</div>

<div id="camera-screen">
  <button class="camera-close" onclick="closeCamera()">×</button>
  <video id="camera-preview" autoplay playsinline muted></video>
  <div class="camera-controls">
    <button class="record-btn" id="record-btn" onclick="toggleRecording()">
      <div class="record-inner"></div>
    </button>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://lakupnehsetdazezlsrs.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_3ePLMRIKVNms7Qi461FQXw_x2TGc75s';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let userProfile = null;
let mediaRecorder = null;
let recordedChunks = [];
let cameraStream = null;

window.addEventListener('load', async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    currentUser = session.user;
    await loadProfile();
    showMainApp();
  } else {
    showAuthSheet();
  }
});

function showAuthSheet() {
  document.getElementById('main-header').classList.add('hide');
  document.getElementById('main-nav').classList.add('hide');
  const content = document.getElementById('sheet-content');
  content.innerHTML = `
    <h2>Log in to Bouncy</h2>
    <input type="email" id="auth-email" placeholder="Email" />
    <input type="password" id="auth-password" placeholder="Password" />
    <p id="auth-error" style="color: #FF3B30; font-size: 13px; margin-bottom: 10px; display: none;"></p>
    <button class="btn-primary" onclick="handleLogin()">Log In</button>
    <button class="btn-secondary" onclick="handleSignUp()">Create Account</button>
  `;
  document.getElementById('sheet-overlay').classList.add('open');
  document.getElementById('sheet').classList.add('open');
}

async function handleLogin() {
  const email = document.getElementById('auth-email').value;
  const password = document.getElementById('auth-password').value;
  const err = document.getElementById('auth-error');
  err.style.display = 'none';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { err.textContent = error.message; err.style.display = 'block'; } 
  else { currentUser = data.user; await loadProfile(); closeSheet(); showMainApp(); }
}

async function handleSignUp() {
  const email = document.getElementById('auth-email').value;
  const password = document.getElementById('auth-password').value;
  const err = document.getElementById('auth-error');
  err.style.display = 'none';
  const { data, error } = await sb.auth.signUp({ email, password });
  if (error) { err.textContent = error.message; err.style.display = 'block'; } 
  else {
    if(data.session) { currentUser = data.user; await loadProfile(); closeSheet(); showMainApp(); } 
    else { err.textContent = "Check your email to confirm your account!"; err.style.display = 'block'; }
  }
}

async function loadProfile() {
  if(!currentUser) return;
  const { data, error } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
  if (error || !data) {
    const defaultUsername = currentUser.email.split('@')[0];
    const { data: newProfile } = await sb.from('profiles').insert([{ id: currentUser.id, username: defaultUsername, display_name: defaultUsername }]).select().single();
    userProfile = newProfile;
  } else { userProfile = data; }
}

function showMainApp() {
  document.getElementById('main-header').classList.remove('hide');
  document.getElementById('main-nav').classList.remove('hide');
  switchTab('feed');
}

function switchTab(tab) {
  document.querySelectorAll('#feed, #trend, #me').forEach(el => el.classList.add('hide'));
  document.getElementById(tab).classList.remove('hide');
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('on'));
  const btn = document.querySelector(`nav button[data-v="${tab}"]`);
  if(btn) btn.classList.add('on');
  if (tab === 'feed') loadVideos();
  if (tab === 'trend') loadExplore();
  if (tab === 'me') renderProfile();
}

// --- FIXED: Bulletproof Feed Loader ---
async function loadVideos() {
  const feed = document.getElementById('feed');
  feed.innerHTML = '<div style="color:var(--mute); text-align:center; padding-top:50px; font-size:14px;">Loading...</div>';
  
  // 1. Get videos (No complex joins that can fail silently)
  const { data: videos, error: videoError } = await sb.from('videos').select('*').order('created_at', { ascending: false });
  
  if (videoError) {
    feed.innerHTML = `<div style="color:#FF3B30; text-align:center; padding:20px; font-size:14px;">Database Error: ${videoError.message}</div>`;
    return;
  }

  if (!videos || videos.length === 0) {
    feed.innerHTML = '<div style="color:var(--mute); text-align:center; padding-top:100px; font-size:15px;">No videos yet.<br><br><button class="btn-primary" style="width:auto; padding:10px 20px;" onclick="openCamera()">Record First Video</button></div>';
    return;
  }

  // 2. Get profiles separately
  const ownerIds = [...new Set(videos.map(v => v.owner_id))];
  const { data: profiles } = await sb.from('profiles').select('id, username').in('id', ownerIds);
  const profileMap = {};
  if (profiles) profiles.forEach(p => profileMap[p.id] = p);

  feed.innerHTML = '';
  
  // 3. Render videos
  videos.forEach(v => {
    // Get Public URL for the video file
    const { data: urlData } = sb.storage.from('videos').getPublicUrl(v.storage_path);
    const videoUrl = urlData.publicUrl;
    
    const authorName = profileMap[v.owner_id]?.username || 'user';
    
    const div = document.createElement('div');
    div.className = 'clip';
    div.innerHTML = `
      <video src="${videoUrl}" loop playsinline muted></video>
      <div class="clip-overlay">
        <b>@${authorName}</b>
        <p>${v.caption || ''}</p>
      </div>
      <div class="side-actions">
        <button onclick="likeVideo('${v.id}', ${v.like_count || 0})">
          <svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></svg>
          ${v.like_count || 0}
        </button>
        <button>
          <svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>
          ${v.comment_count || 0}
        </button>
      </div>
    `;
    
    const vid = div.querySelector('video');
    // Autoplay when scrolling into view
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) { 
          vid.play().catch(err => console.log("Autoplay blocked:", err)); 
        } else { 
          vid.pause(); 
        }
      });
    }, { threshold: 0.6 });
    
    observer.observe(div);
    feed.appendChild(div);
  });
}

async function loadExplore() {
  const trend = document.getElementById('trend');
  trend.innerHTML = '<div class="feed-container"><h2 style="font-size:24px; font-weight:800; margin-bottom:16px;">Explore</h2></div>';
  const { data: posts } = await sb.from('posts').select('*, profiles(username)').order('created_at', { ascending: false });
  const container = trend.querySelector('.feed-container');
  if(!posts || posts.length === 0) { container.innerHTML += '<p style="color:var(--mute); font-size:15px;">No posts yet.</p>'; return; }
  posts.forEach(p => {
    const div = document.createElement('div');
    div.className = 'post-card';
    const imgHtml = p.image_path ? `<img src="${sb.storage.from('videos').getPublicUrl(p.image_path).data.publicUrl}" class="post-image">` : '';
    div.innerHTML = `
      <div class="post-header">
        <div class="avatar">${(p.profiles?.username || 'U')[0].toUpperCase()}</div>
        <div class="post-meta"><b>@${p.profiles?.username || 'user'}</b><span>Just now</span></div>
      </div>
      <p style="font-size:15px; line-height:1.4;">${p.body || ''}</p>
      ${imgHtml}
    `;
    container.appendChild(div);
  });
}

function renderProfile() {
  const me = document.getElementById('me');
  if(!userProfile) return;
  me.innerHTML = `
    <div class="feed-container" style="text-align:center; padding-top:40px;">
      <div class="avatar" style="width: 80px; height: 80px; font-size: 32px; margin: 0 auto 16px;">${userProfile.username[0].toUpperCase()}</div>
      <h2 style="font-size: 22px; font-weight: 700;">@${userProfile.username}</h2>
      <p style="color: var(--mute); margin-bottom: 24px; font-size:14px;">${currentUser.email}</p>
      <button class="btn-secondary" style="width: 80%; margin: 0 auto;" onclick="handleLogout()">Log Out</button>
    </div>
  `;
}

async function handleLogout() { await sb.auth.signOut(); window.location.reload(); }

async function openCamera() {
  const screen = document.getElementById('camera-screen');
  screen.classList.add('open');
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: true });
    document.getElementById('camera-preview').srcObject = cameraStream;
  } catch (err) { alert("Camera access denied."); closeCamera(); }
}

function closeCamera() {
  document.getElementById('camera-screen').classList.remove('open');
  if(cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
}

function toggleRecording() {
  const btn = document.getElementById('record-btn');
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
    btn.classList.remove('recording');
  } else {
    recordedChunks = [];
    mediaRecorder = new MediaRecorder(cameraStream, { mimeType: 'video/webm' });
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      closeCamera();
      await promptUpload(blob);
    };
    mediaRecorder.start();
    btn.classList.add('recording');
  }
}

async function promptUpload(blob) {
  const sheet = document.getElementById('sheet');
  const content = document.getElementById('sheet-content');
  content.innerHTML = `
    <h2>Post Video</h2>
    <input type="text" id="video-caption" placeholder="Write a caption..." />
    <p id="upload-status" style="color: var(--mute); font-size: 13px; margin-bottom: 10px;"></p>
    <button class="btn-primary" id="upload-btn">Share</button>
  `;
  document.getElementById('sheet-overlay').classList.add('open');
  sheet.classList.add('open');
  
  document.getElementById('upload-btn').onclick = async () => {
    const caption = document.getElementById('video-caption').value;
    const status = document.getElementById('upload-status');
    const btn = document.getElementById('upload-btn');
    status.textContent = "Uploading... Please wait."; btn.disabled = true;
    
    const fileName = `${currentUser.id}/${Date.now()}.webm`;
    
    // Upload to Storage
    const { error: uploadError } = await sb.storage.from('videos').upload(fileName, blob, { contentType: 'video/webm' });
    if (uploadError) { status.textContent = "Storage Error: " + uploadError.message; btn.disabled = false; return; }
    
    // Insert to Database
    const { error: dbError } = await sb.from('videos').insert([{ owner_id: currentUser.id, storage_path: fileName, caption: caption }]);
    if (dbError) { status.textContent = "Database Error: " + dbError.message; btn.disabled = false; return; }
    
    status.textContent = "Success!";
    setTimeout(() => { closeSheet(); switchTab('feed'); }, 1000);
  };
}

function closeSheet() {
  document.getElementById('sheet-overlay').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
}

function openChats() {
  const content = document.getElementById('sheet-content');
  content.innerHTML = `<h2>Chats</h2><p style="color:var(--mute); font-size:15px;">Messaging coming soon.</p>`;
  document.getElementById('sheet-overlay').classList.add('open');
  document.getElementById('sheet').classList.add('open');
}

function openLive() {
  const content = document.getElementById('sheet-content');
  content.innerHTML = `<h2>Live</h2><p style="color:var(--mute); font-size:15px;">Live broadcasting coming soon.</p>`;
  document.getElementById('sheet-overlay').classList.add('open');
  document.getElementById('sheet').classList.add('open');
}

function likeVideo(id, count) {
  sb.from('videos').update({ like_count: (count || 0) + 1 }).eq('id', id).then(() => loadVideos());
}
</script>
</body>
</html>
