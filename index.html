<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bouncy v2 🎉</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #f7f7f7; color: #222; }
    .screen { max-width: 600px; margin: 0 auto; padding: 24px; }
    .hidden { display: none !important; }
    h1 { font-size: 28px; margin-bottom: 8px; }
    input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; margin-bottom: 12px; }
    button { width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; background: #ff6b6b; color: #fff; margin-bottom: 10px; }
    button.alt { background: #4ecdc4; }
    .msg { color: #ff6b6b; text-align: center; margin-top: 16px; font-weight: bold; }
  </style>
</head>
<body>
  <div id="auth-screen" class="screen">
    <h1>Bouncy v2 🎉</h1>
    <input id="email" type="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Password (6+ chars)" />
    <button id="signin-btn">Sign In</button>
    <button id="signup-btn" class="alt">Sign Up</button>
    <p id="auth-msg" class="msg"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // THIS WILL POP UP IMMEDIATELY IF THE CODE IS RUNNING
    alert("BOUNCY V2 IS ALIVE!");

    const SUPABASE_URL = 'https://lakupnehsetdazezlsrs.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_3ePLMRIKVNms7Qi461FQXw_x2TGc75s';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const authMsg = document.getElementById('auth-msg');

    document.getElementById('signin-btn').addEventListener('click', async () => {
      alert("Sign In button clicked!");
      authMsg.textContent = "Loading...";
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const { error } = await supabase.auth.signInWithPassword({ email, password });
      
      if (error) {
        authMsg.textContent = "Error: " + error.message;
        alert("Supabase says: " + error.message);
      } else {
        authMsg.textContent = "Success!";
        alert("Success! You are logged in.");
      }
    });

    document.getElementById('signup-btn').addEventListener('click', async () => {
      alert("Sign Up button clicked!");
      authMsg.textContent = "Creating...";
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const { error } = await supabase.auth.signUp({ email, password });
      
      if (error) {
        authMsg.textContent = "Error: " + error.message;
        alert("Supabase says: " + error.message);
      } else {
        authMsg.textContent = "Account created! Go sign in.";
        alert("Account created successfully!");
      }
    });
  </script>
</body>
</html>
