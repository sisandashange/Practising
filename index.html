<html lang="en"><head><meta charset="utf-8"><title>BOUNCY</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#ffffff"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">

<style>
:root{--bg:#fff;--fg:#000;--mute:#666;--line:#e2e2e2;--soft:#f0f0f0;--f:'Bricolage Grotesque',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);font-weight:500}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
button:disabled{opacity:.55;cursor:wait}
button{-webkit-tap-highlight-color:transparent}
img,video{max-width:100%}
@media (max-width:360px){.side{right:6px;gap:9px}.side button{width:46px;font-size:11px}.meta{left:10px;right:64px}.meta strong{font-size:16px}}
@media (min-width:700px){#app{height:min(100dvh,900px);margin:20px auto;border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 60px rgba(0,0,0,.10)}}
#app{max-width:430px;height:100%;margin:auto;display:flex;flex-direction:column;border-inline:1px solid var(--line);position:relative;overflow:hidden}
header{height:52px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--line);font-weight:800;font-size:22px;letter-spacing:.02em;gap:8px}
header i{width:14px;height:14px;border-radius:50%;background:var(--fg);animation:hop 1s infinite;transform-origin:bottom}
@keyframes hop{50%{transform:translateY(-6px)}}
main{flex:1;position:relative;min-height:0}
.v{position:absolute;inset:0;overflow-y:auto}
.hide{display:none}
#feed{scroll-snap-type:y mandatory;overscroll-behavior:contain}
.clip{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;background:var(--bg)}
.clip.real{--fg:#fff;--bg:#000}
.p0{background-image:repeating-linear-gradient(90deg,transparent 0 28px,var(--line) 28px 30px)}
.p1{background-image:radial-gradient(var(--line) 2px,transparent 2px);background-size:24px 24px}
.p2{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px}
.p3{background-image:repeating-linear-gradient(45deg,transparent 0 22px,var(--line) 22px 24px)}
.clip video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ball{position:absolute;left:calc(50% - 32px);bottom:36%;width:64px;height:64px;border-radius:50%;background:var(--fg);transform-origin:bottom;animation:b 1.2s infinite}
.sh{position:absolute;left:calc(50% - 32px);bottom:calc(36% - 8px);width:64px;height:12px;border-radius:50%;background:var(--fg);animation:s 1.2s infinite}
.clip:not(.on) .ball,.clip:not(.on) .sh{animation-play-state:paused}
@keyframes b{0%,100%{transform:translateY(0) scale(1.3,.7);animation-timing-function:cubic-bezier(.2,.7,.4,1)}50%{transform:translateY(-190px) scale(.92,1.1);animation-timing-function:cubic-bezier(.6,0,.8,.3)}}
@keyframes s{0%,100%{transform:scale(1.2);opacity:.35}50%{transform:scale(.4);opacity:.1}}
.side{position:absolute;right:10px;bottom:24px;display:flex;flex-direction:column;gap:14px;align-items:center}
.side button{display:flex;flex-direction:column;align-items:center;gap:2px;width:52px;min-height:52px;font-size:12px;font-weight:800;color:var(--fg);text-shadow:0 0 6px var(--bg)}
svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.liked svg{fill:currentColor}
.meta{position:absolute;left:14px;right:80px;bottom:24px;color:var(--fg);text-shadow:0 0 8px var(--bg)}
.meta strong{font-weight:800;font-size:17px;margin-right:10px}
.meta p{margin:6px 0 0;line-height:1.35}
.fol{border:1.5px solid var(--fg);border-radius:20px;padding:4px 14px;font-weight:800;font-size:13px;background:var(--bg)}
.fol.on{background:var(--fg);color:var(--bg)}
.burst{position:absolute;font-size:80px;line-height:1;pointer-events:none;color:var(--fg);animation:pop .7s forwards}
@keyframes pop{0%{transform:scale(.4);opacity:1}60%{transform:scale(1.2);opacity:1}100%{transform:scale(1.4) translateY(-30px);opacity:0}}
nav{height:60px;display:flex;border-top:1px solid var(--line)}
nav button{flex:1;font-weight:800;font-size:14px;color:var(--mute)}
nav button.on{color:var(--fg)}
nav .plus{flex:0 0 64px}
nav .plus span{display:inline-grid;place-items:center;width:46px;height:34px;border-radius:12px;background:var(--fg);color:var(--bg);font-size:24px;line-height:1}
h2{font-size:26px;margin:18px 16px 4px;font-weight:800}
.sub{margin:0 16px 14px;color:var(--mute)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.tile{aspect-ratio:3/4;position:relative;border:0;background-color:var(--bg);color:var(--fg);text-align:left;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;outline:1px solid var(--line)}
.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile b,.tile span{position:relative;text-shadow:0 0 6px var(--bg)}
.tile .rk{position:absolute;top:8px;left:10px;font-size:34px;font-weight:800}
.prof{display:flex;gap:16px;align-items:center;padding:20px 16px}
.av{width:72px;height:72px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:30px;font-weight:800}
.stats{display:flex;gap:20px}.stats div{text-align:center}.stats b{display:block;font-size:20px}.stats span{color:var(--mute);font-size:13px}
.empty{padding:40px 24px;text-align:center;color:var(--mute);grid-column:1/-1}
.btn{background:var(--fg);color:var(--bg);border-radius:12px;padding:12px 20px;font-weight:800;margin-top:14px}
#shade{position:absolute;inset:0;background:rgba(0,0,0,.55);display:none;z-index:5}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:75%;background:var(--bg);border-top:1.5px solid var(--fg);border-radius:20px 20px 0 0;padding:16px;display:none;flex-direction:column;z-index:6}
#shade.o,#sheet.o{display:flex}
#sheet h3{margin:0 0 10px;font-size:18px;font-weight:800}
#sheet .list{overflow-y:auto;flex:1;min-height:80px}
.cm{padding:8px 0;border-bottom:1px solid var(--line)}.cm b{margin-right:8px}
.row{display:flex;gap:8px;margin-top:12px}
input{flex:1;min-width:0;background:var(--bg);color:var(--fg);border:1.5px solid var(--fg);border-radius:12px;padding:12px;font:inherit}
.row .btn{margin:0}
#sheet video{width:100%;max-height:34vh;background:#000;border-radius:12px}
#toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:20px;font-weight:800;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;white-space:nowrap}
#toast.o{opacity:1}
@media (prefers-reduced-motion:reduce){.ball,.sh,header i{animation:none}.ball{transform:translateY(-90px)}}
.col{display:flex;flex-direction:column;gap:10px}[hidden]{display:none!important}.tile{background:#000;color:#fff}.tile b,.tile span{text-shadow:0 0 6px #000}.tabs{margin-left:auto;display:flex;align-items:center;gap:2px}.tabs button{font-size:14px;font-weight:800;color:var(--mute);padding:8px 8px;border-bottom:2px solid transparent}.tabs button.on{color:var(--fg);border-bottom-color:var(--fg)}.tabs svg{width:22px;height:22px}#chat:not(.hide){display:flex;flex-direction:column;overflow:hidden}#sheet .row{flex-wrap:wrap}
nav button:not(.plus){display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:800}
nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
#app.watch header{position:absolute;top:0;left:0;right:0;z-index:4;border:0;color:#fff;--fg:#fff;--mute:rgba(255,255,255,.7);background:linear-gradient(rgba(0,0,0,.55),transparent);height:60px}
#app.watch nav{background:#000;border-color:#222;--fg:#fff;--bg:#000;--mute:#8a8a8a;--line:#222;color:#fff}
header{height:56px}h2{font-size:30px;letter-spacing:-.01em}
.tabs button{font-size:15px}
.cm{padding:12px 0}
#app:not(.watch) .tabs{display:none}textarea{width:100%;font:inherit;border:1.5px solid var(--fg);border-radius:12px;padding:12px;background:var(--bg);color:var(--fg);resize:none}#app.chatting header{display:none}:root[data-theme="dark"]{--bg:#000;--fg:#fff;--mute:#9a9a9a;--line:#2b2b2b;--soft:#1c1c1c;color-scheme:dark}
@media (prefers-color-scheme:dark){:root[data-theme="system"]{--bg:#000;--fg:#fff;--mute:#9a9a9a;--line:#2b2b2b;--soft:#1c1c1c;color-scheme:dark}}
#sheet{overflow-y:auto}
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
/* screen titles stay put while you scroll */
.v>h2{position:sticky;top:0;z-index:3;background:var(--bg);margin:0;padding:0 16px;height:58px;display:flex;align-items:center;font-size:28px}
/* bottom sheets */
#sheet{border-radius:26px 26px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));border-top:0;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
#sheet::before{content:"";display:block;flex:none;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
#sheet h3{font-size:21px;margin:0 0 14px;letter-spacing:-.01em}
/* buttons and chips */
.btn{border-radius:14px;padding:14px 20px;font-size:16px;min-height:48px}
.fol{padding:7px 16px;font-size:14px}
input,textarea{transition:border-color .15s}
input:focus,textarea:focus{border-color:var(--fg)}
/* bottom navigation */
nav button{position:relative}
nav button:not(.plus).on::before{content:"";position:absolute;top:0;left:50%;width:26px;margin-left:-13px;height:3px;border-radius:0 0 3px 3px;background:var(--fg)}
nav button:not(.plus){color:var(--mute)}
nav button.on:not(.plus){color:var(--fg)}
/* video screen: readable text and tidy action column */
.clip.real::before{content:"";position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(transparent,rgba(0,0,0,.6));z-index:1;pointer-events:none}
.side,.meta{z-index:2}
.side{gap:12px}
.meta strong{font-size:18px}
.meta p{font-size:15px;line-height:1.4}
/* chat */
#chat .row input{border-radius:24px;padding:0 16px;height:46px}
#chat .row .btn{border-radius:24px;min-height:46px;padding:0 18px;margin:0}
/* lists and cards */
.cm{padding:13px 0}
.empty{line-height:1.5}
#chat .row #at,#chat .row #mk{padding:0 12px}.pgb{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.3);z-index:2}.pgb i{display:block;height:100%;width:0;background:#fff}.sn{margin-top:8px;font-size:13px;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);color:var(--fg);overflow:hidden;transition:opacity .55s ease,transform .55s ease}
#splash:not(.go),#splash:not(.go) *{animation-play-state:paused!important}
#splash.out{opacity:0;transform:scale(1.05);pointer-events:none}
.sp-stage{position:absolute;inset:0;max-width:430px;margin:auto;animation:sp-shake .5s 2s both}
.sp-floor{position:absolute;left:12%;right:12%;top:58%;height:2px;background:linear-gradient(90deg,transparent,currentColor 18%,currentColor 82%,transparent);transform:scaleX(0);animation:sp-line .7s .1s cubic-bezier(.16,1,.3,1) forwards}
.sp-shadow{position:absolute;left:50%;top:58%;width:76px;height:10px;margin:-3px 0 0 -38px;border-radius:50%;background:currentColor;filter:blur(4px);opacity:0;animation:sp-shadow 2s .2s both}
.sp-ball{position:absolute;left:50%;top:calc(58% - 64px);width:64px;height:64px;margin-left:-32px;border-radius:50%;background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.38),transparent 46%),linear-gradient(currentColor,currentColor);transform-origin:50% 100%;animation:sp-ball 2s .2s both}
.sp-ring{position:absolute;left:50%;top:58%;width:30px;height:8px;margin:-4px 0 0 -15px;border:1.5px solid currentColor;border-radius:50%;opacity:0;animation:sp-ring .9s var(--t) ease-out forwards}
.sp-crack{position:absolute;left:50%;top:calc(58% - 2px);width:320px;height:24px;margin-left:-160px;opacity:0;stroke-dasharray:520;stroke-dashoffset:520;animation:sp-crack .45s 2s cubic-bezier(.2,.7,.3,1) forwards}
.sp-d{position:absolute;left:50%;top:58%;width:5px;height:5px;margin:-3px 0 0 -2px;border-radius:50%;background:currentColor;opacity:0;animation:sp-deb .85s 2s cubic-bezier(.15,.7,.35,1) forwards}
.sp-word{position:absolute;left:0;right:0;top:calc(58% - 92px);height:92px;overflow:hidden;display:flex;justify-content:center;align-items:flex-end;gap:2px;padding-bottom:4px;box-sizing:border-box;font-family:var(--f);font-size:62px;font-weight:800;line-height:1}
.sp-word b{display:inline-block;transform:translateY(115%);animation:sp-up .95s cubic-bezier(.16,1,.3,1) var(--d) forwards}
@supports ((-webkit-background-clip:text) or (background-clip:text)){.sp-word b{background:linear-gradient(105deg,var(--fg) 0 40%,var(--mute) 50%,var(--fg) 60% 100%);background-size:300% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:sp-up .95s cubic-bezier(.16,1,.3,1) var(--d) forwards,sp-shine 1.2s ease-in-out calc(var(--d) + 1s) forwards}}
.sp-tag{position:absolute;left:0;right:0;top:calc(58% + 46px);margin:0;text-align:center;color:var(--mute);font-size:14px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;opacity:0;filter:blur(8px);animation:sp-tag 1.1s 2.75s cubic-bezier(.16,1,.3,1) forwards}
@keyframes sp-line{to{transform:scaleX(1)}}
@keyframes sp-ball{0%{transform:translateY(-66vh) scale(.9,1.12);animation-timing-function:cubic-bezier(.5,0,1,.5)}38%{transform:translateY(0) scale(1,1)}41%{transform:translateY(0) scale(1.42,.6);animation-timing-function:ease-out}44%{transform:translateY(-1vh) scale(.96,1.06);animation-timing-function:cubic-bezier(0,.5,.5,1)}58%{transform:translateY(-20vh) scale(.95,1.08);animation-timing-function:cubic-bezier(.5,0,1,.5)}72%{transform:translateY(0) scale(1,1)}74%{transform:translateY(0) scale(1.25,.78);animation-timing-function:ease-out}76%{transform:translateY(-1vh) scale(.97,1.04);animation-timing-function:cubic-bezier(0,.5,.5,1)}83%{transform:translateY(-7vh) scale(.96,1.06);animation-timing-function:cubic-bezier(.5,0,1,.5)}90%{transform:translateY(0) scale(1,1)}92%{transform:translateY(0) scale(1.6,.5);opacity:1}96%,100%{transform:translateY(0) scale(2.6,.1);opacity:0}}
@keyframes sp-shadow{0%{opacity:0;transform:scaleX(.3)}38%{opacity:.32;transform:scaleX(1)}58%{opacity:.12;transform:scaleX(.55)}72%{opacity:.32;transform:scaleX(1)}83%{opacity:.18;transform:scaleX(.7)}90%{opacity:.32;transform:scaleX(1.05)}96%,100%{opacity:0;transform:scaleX(1.8)}}
@keyframes sp-ring{0%{opacity:.5;transform:scale(1)}100%{opacity:0;transform:scale(11,3)}}
@keyframes sp-crack{0%{opacity:1;stroke-dashoffset:520}100%{opacity:1;stroke-dashoffset:0}}
@keyframes sp-deb{0%{opacity:1;transform:translate(0,0)}60%{opacity:1;transform:translate(calc(var(--dx)*.8),var(--dy))}100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) + 44px))}}
@keyframes sp-shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-2px,1px)}80%{transform:translate(1px,-1px)}}
@keyframes sp-up{to{transform:translateY(0)}}
@keyframes sp-shine{to{background-position:0% 0}}
@keyframes sp-tag{to{opacity:1;filter:blur(0);letter-spacing:.16em}}
@keyframes sp-fade{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.sp-ball,.sp-floor,.sp-shadow,.sp-ring,.sp-crack,.sp-d{display:none}.sp-stage{animation:none}.sp-word b{animation:sp-fade .4s forwards;transform:none;opacity:0}.sp-tag{animation:sp-fade .5s .3s forwards;filter:none}}

.sk{background:linear-gradient(90deg,var(--soft) 25%,var(--line) 37%,var(--soft) 63%);background-size:400% 100%;animation:sk 1.3s ease infinite;border-radius:10px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.v:not(.hide):not(#feed){animation:none!important}#app main>.v:not(#feed){background:var(--bg)!important;opacity:1!important}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
button{transition:transform .12s ease,opacity .15s ease}
button:active:not(:disabled){transform:scale(.96)}
#toast{box-shadow:0 10px 30px rgba(0,0,0,.28)}

input:focus-visible,textarea:focus-visible{outline:none;border-color:var(--fg);box-shadow:0 0 0 3px rgba(128,128,128,.22)}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;background:transparent;color:var(--fg)}
.ib svg{width:24px;height:24px}
.ib.pri{background:var(--fg);color:var(--bg)}
#chat .row input{background:var(--soft);border:1.5px solid transparent;border-radius:24px;padding:0 16px;height:44px}
nav{position:relative}
nav button:not(.plus).on::before{display:none}
#nball{position:absolute;top:-5px;left:0;width:9px;height:9px;border-radius:50%;background:var(--fg);transition:transform .5s cubic-bezier(.34,1.7,.5,1);pointer-events:none}
#nball.hop{animation:nhop .5s ease}
@keyframes nhop{0%{margin-top:0}35%{margin-top:-9px}100%{margin-top:0}}
.liked svg{animation:lk .45s cubic-bezier(.34,1.8,.5,1)}
@keyframes lk{0%{transform:scale(.55)}100%{transform:scale(1)}}

/* BOUNCY premium calling experience */
.call-actions{display:flex;gap:9px;margin-left:auto}.call-actions button{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--soft);border:1px solid var(--line);color:var(--fg);transition:transform .18s,background .18s}.call-actions button:active{transform:scale(.92)}.call-actions svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#callui{position:fixed;inset:0;z-index:1000;background:radial-gradient(ellipse at 50% 20%,#202938 0,#10151e 42%,#080b10 100%);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 26px) 22px calc(env(safe-area-inset-bottom) + 26px);gap:14px;overflow:hidden}
#callui.open{display:flex}#callui .call-top{width:100%;display:flex;justify-content:space-between;align-items:center;color:#aeb8c7;font-size:12px;letter-spacing:.12em;text-transform:uppercase}#callui .call-top strong{font-size:12px;font-weight:700;color:#e7edf6}#callui .call-stage{position:relative;width:100%;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}

async function hostAcceptViewer(s,viewerId,offer){
 let pc=s.pcs.get(viewerId);
 if(pc){pc.close();s.pcs.delete(viewerId)}
 pc=new RTCPeerConnection(liveRtcConfig);s.pcs.set(viewerId,pc);
 pc.onicecandidate=e=>{if(e.candidate)sendLiveSignal(s,viewerId,'candidate',{...e.candidate.toJSON(),_peer:'viewer'})};
 pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed'||pc.connectionState==='closed'){pc.close();if(s.pcs.get(viewerId)===pc)s.pcs.delete(viewerId)}};
 s.stream.getTracks().forEach(t=>pc.addTrack(t,s.stream));
  for(const sender of pc.getSenders()){if(sender.track?.kind==='video'){try{const p=sender.getParameters();p.encodings=p.encodings?.length?p.encodings:[{}];p.encodings[0].maxBitrate=450000;p.encodings[0].maxFramerate=15;await sender.setParameters(p)}catch(e){}}}
 await pc.setRemoteDescription(offer);
 const q=s.queues.get(viewerId)||[];s.queues.delete(viewerId);for(const cand of q)try{await pc.addIceCandidate(cand)}catch(e){}
 const answer=await pc.createAnswer();await pc.setLocalDescription(answer);
 await sendLiveSignal(s,viewerId,'answer',{...pc.localDescription.toJSON(),_peer:'viewer'});
 for(const [guestId,guestStream] of (s.cohostStreams||new Map())) await relayCohostTrackToViewers(s,guestId,guestStream);
}
async function renegotiateBouncyViewer(s,viewerId,pc){
 if(!pc||pc.connectionState==='closed')return;
 if(pc.signalingState!=='stable'){pc._bouncyNeedsRenegotiate=true;return}
 pc._bouncyNeedsRenegotiate=false;
 try{const offer=await pc.createOffer();await pc.setLocalDescription(offer);await sendLiveSignal(s,viewerId,'offer',{...pc.localDescription.toJSON(),_peer:'viewer'})}
 catch(e){console.warn('BOUNCY viewer renegotiation',e)}
}
async function relayCohostTrackToViewers(s,userId,stream){
 for(const [viewerId,pc] of (s.pcs||new Map())){
  if(!pc||pc.connectionState==='closed')continue;
  const tracks=stream.getTracks().filter(t=>t.readyState==='live');
  let added=false;
  for(const track of tracks){if(!pc.getSenders().some(x=>x.track?.id===track.id)){pc.addTrack(track,stream);added=true}}
  if(added)await renegotiateBouncyViewer(s,viewerId,pc);
 }
}
async function hostAcceptCohost(s,userId,offer){

 if(member.error||member.data?.status!=='accepted')return;
 let pc=s.cohostPcs?.get(userId);if(pc){pc.close();s.cohostPcs.delete(userId)}
 if(!s.cohostPcs)s.cohostPcs=new Map();if(!s.cohostStreams)s.cohostStreams=new Map();
 pc=new RTCPeerConnection(liveRtcConfig);s.cohostPcs.set(userId,pc);
 pc.onicecandidate=e=>{if(e.candidate)sendLiveSignal(s,userId,'candidate',{...e.candidate.toJSON(),_peer:'cohost'})};
 pc.ontrack=async e=>{
  let stream=e.streams?.[0];if(!stream){stream=s.cohostStreams.get(userId)||new MediaStream();if(!stream.getTracks().some(t=>t.id===e.track.id))stream.addTrack(e.track)}

 await pc.setRemoteDescription(offer);
 const q=s.cohostQueues?.get(userId)||[];if(s.cohostQueues)s.cohostQueues.delete(userId);for(const cand of q)try{await pc.addIceCandidate(cand)}catch(e){}

async function handleLiveSignal(s,x){
 if(!s||liveSession!==s||s.closing||x.sender_id===me.id||x.recipient_id!==me.id)return;
 const payload=x.payload||{},peerKind=payload._peer||'viewer';
 try{
  if(s.host){
   if(x.signal_type==='offer'){
    if(peerKind==='cohost')await hostAcceptCohost(s,x.sender_id,payload);
    else await hostAcceptViewer(s,x.sender_id,payload);
   }else if(x.signal_type==='answer'){
    const pc=peerKind==='cohost'?s.cohostPcs?.get(x.sender_id):s.pcs.get(x.sender_id);
    if(pc?.signalingState==='have-local-offer'){await pc.setRemoteDescription(payload);if(peerKind==='viewer'&&pc._bouncyNeedsRenegotiate)await renegotiateBouncyViewer(s,x.sender_id,pc)}
   }else if(x.signal_type==='candidate'){
    const pc=peerKind==='cohost'?s.cohostPcs?.get(x.sender_id):s.pcs.get(x.sender_id);
    const queues=peerKind==='cohost'?(s.cohostQueues||(s.cohostQueues=new Map())):s.queues;
    if(pc?.remoteDescription)await pc.addIceCandidate(payload);else{const q=queues.get(x.sender_id)||[];q.push(payload);queues.set(x.sender_id,q)}
   }else if(x.signal_type==='leave'){
    if(peerKind==='cohost')await window.bouncyRemoveCohost?.(s,x.sender_id);else{const pc=s.pcs.get(x.sender_id);pc?.close();s.pcs.delete(x.sender_id)}
    s.queues?.delete(x.sender_id);s.cohostQueues?.delete(x.sender_id);
   }
  }else if(s.isCohost){
   if(x.signal_type==='answer'&&peerKind==='cohost'&&s.cohostPc?.signalingState==='have-local-offer'){await s.cohostPc.setRemoteDescription(payload);for(const cand of(s.cohostQueues||[]).splice(0))try{await s.cohostPc.addIceCandidate(cand)}catch(e){}}
   else if(x.signal_type==='offer'&&peerKind==='viewer'&&s.pc){
    await s.pc.setRemoteDescription(payload);for(const cand of(s.queues||[]).splice(0))try{await s.pc.addIceCandidate(cand)}catch(e){}const answer=await s.pc.createAnswer();await s.pc.setLocalDescription(answer);
    await sendLiveSignal(s,s.hostId,'answer',{...s.pc.localDescription.toJSON(),_peer:'viewer'});
   }else if(x.signal_type==='candidate'){
    const pc=peerKind==='cohost'?s.cohostPc:s.pc;
    const queues=peerKind==='cohost'?(s.cohostQueues||(s.cohostQueues=[])):s.queues;
    if(pc?.remoteDescription)await pc.addIceCandidate(payload);else queues.push(payload);
   }else if(x.signal_type==='leave'){toast('The host ended this live');leaveLiveStream(true)}
  }else{
   const pc=s.pc;
   if(x.signal_type==='offer'&&peerKind==='viewer'&&pc){
    await pc.setRemoteDescription(payload);for(const cand of(s.queues||[]).splice(0))try{await pc.addIceCandidate(cand)}catch(e){}const answer=await pc.createAnswer();await pc.setLocalDescription(answer);
    await sendLiveSignal(s,s.hostId,'answer',{...pc.localDescription.toJSON(),_peer:'viewer'});
   }else if(x.signal_type==='answer'&&peerKind==='viewer'&&pc?.signalingState==='have-local-offer'){
    await pc.setRemoteDescription(payload);for(const cand of(s.queues||[]))try{await pc.addIceCandidate(cand)}catch(e){}s.queues=[];
   }else if(x.signal_type==='candidate'&&peerKind==='viewer'){
    if(pc?.remoteDescription)await pc.addIceCandidate(payload);else s.queues.push(payload);
   }else if(x.signal_type==='leave'){toast('Live ended');leaveLiveStream(true)}
  }
 }catch(e){console.warn('BOUNCY LIVE signal',e)}
}

window.bouncyRemoveCohost=async function(s,userId){
 const pc=s?.cohostPcs?.get(userId);if(pc){pc.close();s.cohostPcs.delete(userId)}
 const stream=s?.cohostStreams?.get(userId);if(stream){
  for(const [viewerId,viewerPc] of (s.pcs||new Map())){
   let changed=false;
   for(const sender of viewerPc.getSenders()){if(stream.getTracks().some(t=>t.id===sender.track?.id)){try{viewerPc.removeTrack(sender);changed=true}catch(e){}}}
   if(changed)await renegotiateBouncyViewer(s,viewerId,viewerPc);
  }

function setCallMode(c){const ui=$('#callui');ui.classList.toggle('video-mode',c?.kind==='video');$('#calltype-label').textContent=c?.kind==='video'?'VIDEO CALL':'VOICE CALL';$('#callavatar').textContent=(c?.name||'B').trim().charAt(0).toUpperCase();$('#callhint').textContent=c?.kind==='video'?'Camera and microphone are active only during the call':'Microphone audio call · Camera disabled';}
async function signalCall(kind,payload){const c=activeCall;if(!c)return;const r=await sb.from('call_signals').insert({call_id:c.id,sender_id:me.id,recipient_id:c.peer,signal_type:kind,payload});if(r.error)console.warn('Call signal failed',r.error)}
async function endCall(status='ended'){
 const c=activeCall;if(!c)return;activeCall=null;if(c.timer)clearTimeout(c.timer);
 if(c.id&&c.peer&&status==='ended'&&!c.remoteEnded)await sb.from('call_signals').insert({call_id:c.id,sender_id:me.id,recipient_id:c.peer,signal_type:'hangup',payload:{}});
 try{c.pc?.close()}catch(e){}try{c.stream?.getTracks().forEach(t=>t.stop())}catch(e){}
 if(c.channel)sb.removeChannel(c.channel);if(c.sessionChannel)sb.removeChannel(c.sessionChannel);

 if(c.id)await sb.from('call_sessions').update({status,ended_at:new Date().toISOString()}).eq('id',c.id);

}
function renderCallControls(incoming=false){const c=activeCall;if(!c)return;
 if(incoming){callButtons([['Decline',()=>endCall('rejected'),'hang','decline'],['Answer',()=>answerCall(),'answer','answer']]);return}
 const items=[ [c.muted?'Unmute':'Mute',()=>{if(!activeCall)return;c.muted=!c.muted;c.stream?.getAudioTracks().forEach(t=>t.enabled=!c.muted);renderCallControls()},c.muted?'active':'','mute'] ];

async function setupPeer(c){
 c.pc=new RTCPeerConnection(rtcConfig);c.pendingCandidates=[];
 c.pc.onicecandidate=e=>{if(e.candidate)signalCall('candidate',e.candidate.toJSON())};
 c.pc.ontrack=e=>{const v=$('#callremote');if(v.srcObject!==e.streams[0])v.srcObject=e.streams[0];$('#callstatus').textContent='Connected'};
 c.pc.onconnectionstatechange=()=>{if(!activeCall||activeCall!==c)return;const st=c.pc.connectionState;if(st==='connected'){$('#callstatus').textContent='Connected';if(c.timer){clearTimeout(c.timer);c.timer=null}}if(st==='failed'){$('#callstatus').textContent='Connection failed · Network relay may be needed';toast('Call failed. A TURN relay may be required.')}if(st==='disconnected')$('#callstatus').textContent='Reconnecting…';if(st==='closed'&&activeCall===c)endCall()};
 c.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:c.kind==='video'?{facingMode:{ideal:'user'}}:false});
 c.facing='user';$('#calllocal').srcObject=c.stream;c.stream.getTracks().forEach(t=>c.pc.addTrack(t,c.stream));
 c.channel=sb.channel('call-signals-'+c.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'call_signals',filter:'call_id=eq.'+c.id},async ev=>{const x=ev.new;if(!activeCall||activeCall!==c||x.sender_id===me.id)return;try{
 if(x.signal_type==='answer'&&c.pc.signalingState==='have-local-offer'){await c.pc.setRemoteDescription(x.payload);$('#callstatus').textContent='Connecting…'}
 else if(x.signal_type==='offer'&&c.pc.signalingState==='stable'){await c.pc.setRemoteDescription(x.payload);for(const cand of c.pendingCandidates.splice(0))await c.pc.addIceCandidate(cand);const a=await c.pc.createAnswer();await c.pc.setLocalDescription(a);await signalCall('answer',c.pc.localDescription.toJSON())}
 else if(x.signal_type==='candidate'&&x.payload){if(c.pc.remoteDescription)await c.pc.addIceCandidate(x.payload);else c.pendingCandidates.push(x.payload)}else if(x.signal_type==='hangup'){c.remoteEnded=true;endCall('ended')}
 }catch(err){console.warn('Call signal handling',err);toast('Could not establish the call')}}).subscribe();
 const old=await sb.from('call_signals').select('*').eq('call_id',c.id).neq('sender_id',me.id).order('created_at');
 for(const x of(old.data||[])){try{if(x.signal_type==='offer'&&c.pc.signalingState==='stable'){await c.pc.setRemoteDescription(x.payload);for(const cand of c.pendingCandidates.splice(0))await c.pc.addIceCandidate(cand);if(c.accepted){const a=await c.pc.createAnswer();await c.pc.setLocalDescription(a);await signalCall('answer',c.pc.localDescription.toJSON())}}else if(x.signal_type==='candidate'&&x.payload){if(c.pc.remoteDescription)await c.pc.addIceCandidate(x.payload);else c.pendingCandidates.push(x.payload)}else if(x.signal_type==='answer'&&c.pc.signalingState==='have-local-offer')await c.pc.setRemoteDescription(x.payload)}catch(e){console.warn(e)}}
}
async function beginCallerMedia(c){if(!activeCall||activeCall!==c||c.started)return;c.started=true;try{await setupPeer(c);const o=await c.pc.createOffer();await c.pc.setLocalDescription(o);await signalCall('offer',c.pc.localDescription.toJSON());$('#callstatus').textContent='Connecting…'}catch(e){console.error(e);toast('Could not start media. Check microphone/camera permissions.');endCall('ended')}}
async function startCall(peer,name,kind){
 if(!me){authSheet('make a call');return}if(!navigator.mediaDevices?.getUserMedia||!window.RTCPeerConnection){toast('Calls need a supported browser and HTTPS');return}if(activeCall){toast('Finish your current call first');return}
 const r=await sb.from('call_sessions').insert({caller_id:me.id,callee_id:peer,call_type:kind,status:'ringing'}).select('id').single();if(r.error){toast('Call could not be saved: '+r.error.message);console.error('BOUNCY CALL ERROR',r.error);return}
 const c=activeCall={id:r.data.id,peer,kind,caller:true,name,accepted:false,started:false,muted:false,cameraOff:false,speakerOff:false};setCallMode(c);$('#callname').textContent='@'+name;$('#callstatus').textContent='Calling…';callUi(true);renderCallControls();
 c.timer=setTimeout(()=>{if(activeCall===c&&!c.accepted)endCall('missed')},35000);
 c.sessionChannel=sb.channel('call-session-'+c.id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'call_sessions',filter:'id=eq.'+c.id},ev=>{if(!activeCall||activeCall!==c)return;if(ev.new.status==='accepted'&&!c.accepted){c.accepted=true;if(c.timer){clearTimeout(c.timer);c.timer=null}$('#callstatus').textContent='Connecting…';beginCallerMedia(c)}if(ev.new.status==='rejected')endCall('rejected');if(ev.new.status==='missed')endCall('missed');if(ev.new.status==='ended')endCall('ended')}).subscribe();
}

async function answerCall(){const c=activeCall;if(!c||c.caller)return;c.accepted=true;$('#callstatus').textContent='Connecting…';try{await setupPeer(c);const u=await sb.from('call_sessions').update({status:'accepted'}).eq('id',c.id);if(u.error)throw u.error;renderCallControls()}catch(e){console.error(e);toast('Could not answer: '+(e.message||'check permissions'));endCall('ended')}}

async function loadCallHistory(){if(!me)return;const d=$('#inbox');d.append(E('p','padding:10px 16px;color:var(--mute);font-size:12px','Your recent voice and video calls'));const r=await sb.from('call_sessions').select('id,caller_id,callee_id,call_type,status,created_at').or('caller_id.eq.'+me.id+',callee_id.eq.'+me.id).order('created_at',{ascending:false}).limit(60);if(r.error){d.append(E('p','padding:16px;color:var(--mute)','Could not load call history.'));return}const ids=[...new Set((r.data||[]).map(x=>x.caller_id===me.id?x.callee_id:x.caller_id))],ps={};if(ids.length){const q=await sb.from('profiles').select('id,username,avatar_url').in('id',ids);(q.data||[]).forEach(x=>ps[x.id]=x)}if(!r.data?.length){d.append(E('div','padding:35px 20px;text-align:center;color:var(--mute)','No calls yet. Your voice and video calls will appear here.'));return}r.data.forEach(x=>{const incoming=x.callee_id===me.id,other=incoming?x.caller_id:x.callee_id,P=ps[other]||{username:'BOUNCY user'},missed=x.status==='missed',b=E('button','display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;text-align:left;border-bottom:1px solid var(--line)');b.append(avatar(P.username,P.avatar_url,46));const tx=E('div','flex:1;min-width:0'),top=E('div','display:flex;justify-content:space-between;gap:8px'),nm=E('b','','@'+P.username),tm=E('span','font-size:12px;color:var(--mute)',ago(x.created_at)),sub=E('div','font-size:13px;margin-top:3px;color:'+(missed?'#ef6868':'var(--mute)'),(missed?'Missed ':'')+(incoming?'Incoming ':'Outgoing ')+(x.call_type==='audio'?'voice call':'video call'));top.append(nm,tm);tx.append(top,sub);b.append(tx,E('span','font-size:18px;color:var(--mute)',x.call_type==='audio'?'☎':'▣'));b.onclick=()=>{if(missed||x.status==='rejected'||x.status==='ended')startCall(other,P.username,x.call_type)};d.append(b)})}
