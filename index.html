<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bouncy 🎉</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="auth-screen" class="screen">
    <h1>Bouncy 🎉</h1>
    <p class="tagline">Where ideas bounce.</p>
    <input id="email" type="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Password (6+ chars)" />
    <button id="signin-btn">Sign In</button>
    <button id="signup-btn" class="alt">Sign Up</button>
    <p id="auth-msg" class="msg"></p>
  </div>

  <div id="feed-screen" class="screen hidden">
    <header>
      <h1>Bouncy 🎉</h1>
      <button id="logout-btn">Logout</button>
    </header>
    <div class="composer">
      <textarea id="post-input" placeholder="What's bouncin'?"></textarea>
      <button id="post-btn">Post</button>
    </div>
    <div id="feed"></div>
    <p id="feed-empty" class="msg">No posts yet. Be the first! 🚀</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
