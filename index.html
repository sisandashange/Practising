<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Bouncy - Where ideas bounce</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root {
  --bg: #09090B; 
  --surface: #121214;
  --surface-light: #1C1C1F;
  --fg: #FFFFFF;
  --mute: #888888;
  --orange: #FF6B35;
  --line: #27272A;
  --font: 'Bricolage Grotesque', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: var(--font); }
body { background: var(--bg); color: var(--fg); height: 100dvh; width: 100vw; display: flex; justify-content: center; overflow: hidden; }
#app { width: 100%; max-width: 480px; height: 100dvh; display: flex; flex-direction: column; position: relative; background: var(--bg); overflow: hidden; }
.hide { display: none !important; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; transition: transform 0.1s; }
button:active { transform: scale(0.95); }
input, textarea { width: 100%; padding: 16px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 16px; font-size: 16px; margin-bottom: 12px; outline: none; transition: border-color 0.2s; }
input:focus, textarea:focus { border-color: var(--orange); }

/* --- SPLASH SCREEN --- */
#splash { position: fixed; inset: 0; z-index: 1000; background: var(--bg); display: flex; justify-content: center; align-items: center; flex-direction: column; transition: opacity 0.5s; }
#splash.out { opacity: 0; pointer-events: none; }
.splash-logo { font-size: 48px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.ball-anim { width: 20px; height: 20px; background: var(--orange); border-radius: 50%; animation: bounce 1s infinite alternate; }
@keyframes bounce { to { transform: translateY(-15px); } }

/* --- HEADER --- */
.header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: var(--bg); border-bottom: 1px solid var(--line); z-index: 10; }
.logo { font-size: 24px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
.live-btn { background: var(--surface-light); padding: 6px 14px; border-radius: 20px; font-weight: 800; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.live-dot { width: 8px; height: 8px; background: #FF3B30; border-radius: 50%; animation: pulse 1.5s infinite; }
@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

/* --- BOTTOM NAV (UNIQUE FLOATING STYLE) --- */
.nav-wrapper { position: absolute; bottom: 0; left: 0; right: 0; padding: 10px 20px calc(10px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 30%); z-index: 20; pointer-events: none; }
nav { background: rgba(28, 28, 31, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-radius: 24px; display: flex; justify-content: space-around; align-items: center; padding: 8px; border: 1px solid rgba(255,255,255,0.08); pointer-events: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
nav button { color: var(--mute); display: flex; flex-direction: column; align-items: center; font-size: 10px; font-weight: 700; gap: 4px; padding: 8px 16px; border-radius: 16px; }
nav button.on { color: var(--fg); background: rgba(255,255,255,0.1); }
nav button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
nav .plus-btn { background: var(--orange); color: #fff; padding: 10px; border-radius: 16px; margin-top: -16px; box-shadow: 0 8px 20px rgba(255, 107, 53, 0.4); }
nav .plus-btn svg { width: 28px; height: 28px; stroke-width: 3; }

/* --- FEED CARDS --- */
.feed-container { flex: 1; overflow-y: auto; padding: 16px 20px; padding-bottom: 100px; }
.post-card { background: var(--surface); border-radius: 20px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--line); }
.post-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--orange), #FF3B30); display: grid; place-items: center; font-weight: 800; font-size: 18px; }
.post-meta b { display: block; font-size: 15px; }
.post-meta span { font-size: 12px; color: var(--mute); }
.post-image { width: 100%; border-radius: 12px; margin-top: 12px; object-fit: cover; max-height: 400px; }
.post-actions { display: flex; gap: 20px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--mute); font-size: 14px; font-weight: 600; }

/* --- WATCH SCREEN (TikTok Style but Bouncy Colors) --- */
#feed { scroll-snap-type: y mandatory; overflow-y: auto; height: 100%; background: #000; }
.clip { height: 100dvh; scroll-snap-align: start; position: relative; display: flex; align-items: center; justify-content: center; }
.clip video { width: 100%; height: 100%; object-fit: contain; }
.clip-overlay { position: absolute; bottom: 90px; left: 20px; right: 80px; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,0.8); }
.clip-overlay b { font-size: 18px; display: block; margin-bottom: 6px; }
.clip-overlay p { font-size: 14px; line-height: 1.4; }
.side-actions { position: absolute; right: 16px; bottom: 90px; display: flex; flex-direction: column; gap: 20px; align-items: center; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
.side-actions button { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; }
.side-actions svg { width: 32px; height: 32px; fill: #fff; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4)); }

/* --- MODALS & SHEETS --- */
.sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 50; display: none; opacity: 0; transition: opacity 0.3s; }
.sheet-overlay.open { display: block; opacity: 1; }
.sheet { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-radius: 24px 24px 0 0; padding: 24px 20px calc(24px + env(safe-area-inset-bottom)); z-index: 51; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); max-height: 90vh; overflow-y: auto; }
.sheet.open { transform: translateY(0); }
.sheet-drag { width: 40px; height: 4px; background: var(--line); border-radius: 2px; margin: 0 auto 16px; }
.btn-primary { background: var(--orange); color: #fff; width: 100%; padding: 16px; border-radius: 16px; font-weight: 800; font-size: 16px; margin-top: 10px; }
.btn-secondary { background: transparent; border: 1.5px solid var(--line); color: var(--fg); width: 100%; padding: 16px; border-radius: 16px; font-weight: 800; font-size: 16px; margin-top: 10px; }

/* Camera Screen */
#camera-screen { position: fixed; inset: 0; background: #000; z-index: 100; display: none; flex-direction: column; }
#camera-screen.open { display: flex; }
#camera-preview { flex: 1; width: 100%; object-fit: cover; }
.camera-controls { position: absolute; bottom: 40px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 40px; }
.record-btn { width: 80px; height: 80px; border-radius: 50%; border: 4px solid #fff; background: rgba(255, 107, 53, 0.8); display: flex; justify-content: center; align-items: center; }
.record-btn.recording { background: #FF3B30; border-radius: 20px; width: 40px; height: 40px; border: none; }
.camera-close { position: absolute; top: 40px; left: 20px; color: #fff; font-size: 30px; }
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="splash-logo">Bouncy <div class="ball-anim"></div></div>
  <p style="color: var(--mute); margin-top: 12px; font-weight: 500;">Where ideas bounce.</p>
</div>

<div id="app" class="watch">
  <!-- MAIN HEADER -->
  <header class="header hide" id="main-header">
    <div class="logo">Bouncy <div class="ball-anim" style="width:12px; height:12px;"></div></div>
    <button class="live-btn" onclick="openLive()"><div class="live-dot"></div> LIVE</button>
  </header>

  <!-- MAIN CONTENT AREA -->
  <main style="flex: 1; position: relative; overflow: hidden;">
    <div id="feed" class="hide" style="height:100%;"></div>
    <div id="trend" class="hide" style="height:100%; overflow-y:auto; padding-bottom:100px;"></div>
    <div id="me" class="hide" style="height:100%; overflow-y:auto; padding-bottom:100px;"></div>
  </main>

  <!-- NAVIGATION -->
  <div class="nav-wrapper hide" id="main-nav">
    <nav>
      <button data-v="feed" class="on" onclick="switchTab('feed')">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        Watch
      </button>
      <button data-v="trend" onclick="switchTab('trend')">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        Explore
      </button>
      <button class="plus-btn" onclick="openCamera()">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button onclick="openChats()">
        <svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>
        Chats
      </button>
      <button data-v="me" onclick="switchTab('me')">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/></svg>
        Me
      </button>
    </nav>
  </div>
</div>

<!-- SHEETS & OVERLAYS -->
<div class="sheet-overlay" id="sheet-overlay" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-drag"></div>
  <div id="sheet-content"></div>
</div>

<!-- CAMERA SCREEN -->
<div id="camera-screen">
  <button class="camera-close" onclick="closeCamera()">×</button>
  <video id="camera-preview" autoplay playsinline muted></video>
  <div class="camera-controls">
    <button class="record-btn" id="record-btn" onclick="toggleRecording()"></button>
  </div>
</div>

<script>
// --- CONFIG ---
const SUPABASE_URL = 'https://lakupnehsetdazezlsrs.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_3ePLMRIKVNms7Qi461FQXw_x2TGc75s';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let userProfile = null;
let activeTab = 'feed';
let mediaRecorder = null;
let recordedChunks = [];
let cameraStream = null;

// --- INIT ---
window.addEventListener('load', async () => {
  setTimeout(() => document.getElementById('splash').classList.add('out'), 2000);
  
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    currentUser = session.user;
    await loadProfile();
    showMainApp();
  } else {
    showAuthSheet();
  }
});

// --- AUTH ---
function showAuthSheet() {
  document.getElementById('main-header').classList.add('hide');
  document.getElementById('main-nav').classList.add('hide');
  
  const sheet = document.getElementById('sheet');
  const content = document.getElementById('sheet-content');
  
  content.innerHTML = `
    <h2 style="margin-bottom: 20px;">Welcome to Bouncy</h2>
    <input type="email" id="auth-email" placeholder="Email" />
    <input type="password" id="auth-password" placeholder="Password (6+ chars)" />
    <p id="auth-error" style="color: #FF3B30; font-size: 14px; margin-bottom: 10px; display: none;"></p>
    <button class="btn-primary" onclick="handleLogin()">Log In</button>
    <button class="btn-secondary" onclick="handleSignUp()">Create Account</button>
  `;
  
  document.getElementById('sheet-overlay').classList.add('open');
  sheet.classList.add('open');
}

async function handleLogin() {
  const email = document.getElementById('auth-email').value;
  const password = document.getElementById('auth-password').value;
  const err = document.getElementById('auth-error');
  err.style.display = 'none';
  
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    err.textContent = error.message;
    err.style.display = 'block';
  } else {
    currentUser = data.user;
    await loadProfile();
    closeSheet();
    showMainApp();
  }
}

async function handleSignUp() {
  const email = document.getElementById('auth-email').value;
  const password = document.getElementById('auth-password').value;
  const err = document.getElementById('auth-error');
  err.style.display = 'none';
  
  const { data, error } = await sb.auth.signUp({ email, password });
  if (error) {
    err.textContent = error.message;
    err.style.display = 'block';
  } else {
    if(data.session) {
      currentUser = data.user;
      await loadProfile();
      closeSheet();
      showMainApp();
    } else {
      err.textContent = "Check your email to confirm your account!";
      err.style.display = 'block';
    }
  }
}

// --- PROFILE ---
async function loadProfile() {
  if(!currentUser) return;
  const { data, error } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
  if (error) {
    // If profile is missing, create it on the fly
    const defaultUsername = currentUser.email.split('@')[0];
    const { data: newProfile } = await sb.from('profiles').insert([{
      id: currentUser.id, 
      username: defaultUsername, 
      display_name: defaultUsername
    }]).select().single();
    userProfile = newProfile;
  } else {
    userProfile = data;
  }
}

// --- NAVIGATION ---
function showMainApp() {
  document.getElementById('main-header').classList.remove('hide');
  document.getElementById('main-nav').classList.remove('hide');
  switchTab('feed');
}

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('#feed, #trend, #me').forEach(el => el.classList.add('hide'));
  document.getElementById(tab).classList.remove('hide');
  
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('on'));
  const btn = document.querySelector(`nav button[data-v="${tab}"]`);
  if(btn) btn.classList.add('on');

  if (tab === 'feed') loadVideos();
  if (tab === 'trend') loadExplore();
  if (tab === 'me') renderProfile();
}

// --- LOAD VIDEOS (TikTok Style Feed) ---
async function loadVideos() {
  const feed = document.getElementById('feed');
  feed.innerHTML = '<div style="color:#fff; text-align:center; padding-top:50px;">Loading...</div>';
  
  const { data: videos, error } = await sb.from('videos').select('*, profiles(username, avatar_url)').order('created_at', { ascending: false });
  if (error || !videos || videos.length === 0) {
    feed.innerHTML = '<div style="color:#fff; text-align:center; padding-top:50px; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%;"><h2 style="font-weight:800; margin-bottom:10px;">No videos yet</h2><p style="color:var(--mute);">Tap the + button to record the first one.</p></div>';
    return;
  }

  feed.innerHTML = '';
  videos.forEach(v => {
    const url = sb.storage.from('videos').getPublicUrl(v.storage_path).data.publicUrl;
    const div = document.createElement('div');
    div.className = 'clip';
    div.innerHTML = `
      <video src="${url}" loop playsinline></video>
      <div class="clip-overlay">
        <b>@${v.profiles?.username || 'user'}</b>
        <p>${v.caption || ''}</p>
      </div>
      <div class="side-actions">
        <button onclick="likeVideo('${v.id}', ${v.like_count})">
          <svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></svg>
          ${v.like_count || 0}
        </button>
        <button onclick="openComments('${v.id}')">
          <svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>
          ${v.comment_count || 0}
        </button>
      </div>
    `;
    
    // Auto-play logic
    const vid = div.querySelector('video');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) { vid.play().catch(()=>{}); }
        else { vid.pause(); }
      });
    }, { threshold: 0.6 });
    observer.observe(div);

    feed.appendChild(div);
  });
}

// --- EXPLORE TAB (Instagram Style) ---
async function loadExplore() {
  const trend = document.getElementById('trend');
  trend.innerHTML = '<h2 style="padding: 20px; font-size:24px; font-weight:800;">Explore</h2>';
  
  const { data: posts } = await sb.from('posts').select('*, profiles(username, avatar_url)').order('created_at', { ascending: false });
  
  if(!posts || posts.length === 0) {
    trend.innerHTML += '<p style="color:var(--mute); padding: 0 20px;">No posts yet. Check back later.</p>';
    return;
  }

  const container = document.createElement('div');
  container.className = 'feed-container';
  
  posts.forEach(p => {
    const div = document.createElement('div');
    div.className = 'post-card';
    const imgHtml = p.image_path ? `<img src="${sb.storage.from('videos').getPublicUrl(p.image_path).data.publicUrl}" class="post-image">` : '';
    
    div.innerHTML = `
      <div class="post-header">
        <div class="avatar">${(p.profiles?.username || 'U')[0].toUpperCase()}</div>
        <div class="post-meta">
          <b>@${p.profiles?.username || 'user'}</b>
          <span>Just now</span>
        </div>
      </div>
      <p>${p.body || ''}</p>
      ${imgHtml}
      <div class="post-actions">
        <span>❤️ ${p.reaction_count || 0}</span>
        <span>💬 ${p.comment_count || 0}</span>
      </div>
    `;
    container.appendChild(div);
  });
  
  trend.appendChild(container);
}

// --- PROFILE TAB ---
function renderProfile() {
  const me = document.getElementById('me');
  if(!userProfile) return;
  
  me.innerHTML = `
    <div class="feed-container" style="text-align:center;">
      <div class="avatar" style="width: 90px; height: 90px; font-size: 36px; margin: 20px auto;">${userProfile.username[0].toUpperCase()}</div>
      <h2 style="font-size: 24px; font-weight: 800;">@${userProfile.username}</h2>
      <p style="color: var(--mute); margin-bottom: 20px;">${currentUser.email}</p>
      
      <div style="display:flex; gap:20px; justify-content:center; margin-bottom: 30px;">
        <div><b style="font-size:20px; display:block;">0</b><span style="color:var(--mute); font-size:12px;">Followers</span></div>
        <div><b style="font-size:20px; display:block;">0</b><span style="color:var(--mute); font-size:12px;">Following</span></div>
      </div>
      
      <button class="btn-secondary" onclick="handleLogout()">Log Out</button>
    </div>
  `;
}

async function handleLogout() {
  await sb.auth.signOut();
  window.location.reload();
}

// --- CAMERA & RECORDING ---
async function openCamera() {
  const screen = document.getElementById('camera-screen');
  screen.classList.add('open');
  
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: true });
    document.getElementById('camera-preview').srcObject = cameraStream;
  } catch (err) {
    alert("Camera access denied or not supported.");
    closeCamera();
  }
}

function closeCamera() {
  const screen = document.getElementById('camera-screen');
  screen.classList.remove('open');
  if(cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
}

function toggleRecording() {
  const btn = document.getElementById('record-btn');
  
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
    btn.classList.remove('recording');
  } else {
    recordedChunks = [];
    mediaRecorder = new MediaRecorder(cameraStream, { mimeType: 'video/webm' });
    
    mediaRecorder.ondataavailable = e => {
      if (e.data.size > 0) recordedChunks.push(e.data);
    };
    
    mediaRecorder.onstop = async () => {
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      closeCamera();
      await uploadVideo(blob);
    };
    
    mediaRecorder.start();
    btn.classList.add('recording');
  }
}

async function uploadVideo(blob) {
  const sheet = document.getElementById('sheet');
  const content = document.getElementById('sheet-content');
  
  content.innerHTML = `
    <h2>Post Video</h2>
    <input type="text" id="video-caption" placeholder="Add a caption..." />
    <p id="upload-status" style="color: var(--mute); font-size: 14px;"></p>
    <button class="btn-primary" id="upload-btn">Upload Now</button>
  `;
  
  document.getElementById('sheet-overlay').classList.add('open');
  sheet.classList.add('open');
  
  document.getElementById('upload-btn').onclick = async () => {
    const caption = document.getElementById('video-caption').value;
    const status = document.getElementById('upload-status');
    const btn = document.getElementById('upload-btn');
    
    status.textContent = "Uploading... Please wait.";
    btn.disabled = true;
    
    const fileName = `${currentUser.id}/${Date.now()}.webm`;
    
    // 1. Upload to Supabase Storage
    const { error: uploadError } = await sb.storage.from('videos').upload(fileName, blob, { contentType: 'video/webm' });
    
    if (uploadError) {
      status.textContent = "Upload failed: " + uploadError.message;
      btn.disabled = false;
      return;
    }
    
    // 2. Save to Database
    const { error: dbError } = await sb.from('videos').insert([{
      owner_id: currentUser.id,
      storage_path: fileName,
      caption: caption
    }]);
    
    if (dbError) {
      status.textContent = "Error saving data: " + dbError.message;
      btn.disabled = false;
      return;
    }
    
    status.textContent = "Success!";
    setTimeout(() => {
      closeSheet();
      switchTab('feed');
    }, 1000);
  };
}

// --- UTILS ---
function closeSheet() {
  document.getElementById('sheet-overlay').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
}

function openChats() {
  const content = document.getElementById('sheet-content');
  content.innerHTML = `<h2>Chats</h2><p style="color:var(--mute);">Messaging coming soon.</p>`;
  document.getElementById('sheet-overlay').classList.add('open');
  document.getElementById('sheet').classList.add('open');
}

function openLive() {
  const content = document.getElementById('sheet-content');
  content.innerHTML = `<h2>Live Streams</h2><p style="color:var(--mute);">Live broadcasting coming soon.</p>`;
  document.getElementById('sheet-overlay').classList.add('open');
  document.getElementById('sheet').classList.add('open');
}

function likeVideo(id, count) {
  // Simple visual like for now
  sb.from('videos').update({ like_count: (count || 0) + 1 }).eq('id', id).then(() => loadVideos());
}
</script>
</body>
</html>
