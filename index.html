<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Bouncy Chat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
/* --- WHATSAPP DARK MODE COLORS --- */
:root {
  --bg: #0B141A; 
  --header: #1F2C34;
  --surface: #202C33;
  --bubble-out: #005C4B;
  --bubble-in: #202C33;
  --fg: #E9EDEF;
  --mute: #8696A0;
  --line: #222D34;
  --brand: #00A884; /* WhatsApp Green */
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: var(--font); }
body { background: #000; color: var(--fg); height: 100dvh; width: 100vw; display: flex; justify-content: center; overflow: hidden; }
#app { width: 100%; max-width: 480px; height: 100dvh; display: flex; flex-direction: column; position: relative; background: var(--bg); overflow: hidden; }
.hide { display: none !important; }

button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; transition: opacity 0.2s; }
button:active { opacity: 0.7; }
input, textarea { width: 100%; padding: 14px; border: none; background: var(--surface); color: var(--fg); border-radius: 24px; font-size: 16px; outline: none; }

/* --- HEADER --- */
.header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--header); z-index: 10; height: 60px; }
.logo { font-size: 20px; font-weight: 600; color: var(--fg); }
.header-actions { display: flex; gap: 16px; align-items: center; color: var(--fg); }
.header-actions svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; }

/* --- CHAT LIST --- */
#chat-list-screen { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
.chat-item { display: flex; align-items: center; padding: 12px 16px; gap: 12px; cursor: pointer; transition: background 0.2s; }
.chat-item:active { background: var(--surface); }
.avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-weight: 600; font-size: 20px; color: var(--fg); flex-shrink: 0; }
.chat-info { flex: 1; border-bottom: 1px solid var(--line); padding-bottom: 12px; display: flex; flex-direction: column; justify-content: center; height: 48px; }
.chat-name { font-size: 16px; font-weight: 500; color: var(--fg); margin-bottom: 4px; }
.chat-preview { font-size: 14px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* FAB Button */
.fab { position: absolute; bottom: 24px; right: 24px; width: 56px; height: 56px; border-radius: 16px; background: var(--brand); display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 20; }
.fab svg { width: 24px; height: 24px; fill: #fff; }

/* --- CHAT ROOM --- */
#chat-room-screen { position: absolute; inset: 0; background: var(--bg); z-index: 100; display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.3s ease; }
#chat-room-screen.open { transform: translateX(0); }
.chat-header { display: flex; align-items: center; padding: 10px 16px; background: var(--header); gap: 12px; height: 60px; }
.back-btn { color: var(--fg); font-size: 24px; font-weight: 300; padding-right: 8px; }
.chat-header-info { display: flex; flex-direction: column; }
.chat-header-name { font-size: 16px; font-weight: 500; }
.chat-header-status { font-size: 12px; color: var(--mute); }

.messages-area { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-blend-mode: overlay; background-size: cover; }
.msg { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 15px; line-height: 1.4; position: relative; word-wrap: break-word; }
.msg.sent { background: var(--bubble-out); align-self: flex-end; border-top-right-radius: 0; }
.msg.received { background: var(--bubble-in); align-self: flex-start; border-top-left-radius: 0; }
.msg-time { font-size: 11px; color: rgba(255,255,255,0.6); text-align: right; margin-top: 4px; }

.input-area { display: flex; padding: 8px 12px; gap: 8px; background: var(--header); align-items: center; }
.input-area input { flex: 1; padding: 12px 16px; }
.send-btn { width: 48px; height: 48px; border-radius: 50%; background: var(--brand); display: flex; justify-content: center; align-items: center; flex-shrink: 0; }
.send-btn svg { width: 22px; height: 22px; fill: #fff; margin-left: 4px; }

/* --- MODALS & AUTH --- */
.sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 50; display: none; opacity: 0; transition: opacity 0.3s; }
.sheet-overlay.open { display: block; opacity: 1; }
.sheet { position: fixed; bottom: 0; left: 0; right: 0; background: var(--header); border-radius: 16px 16px 0 0; padding: 24px 20px calc(24px + env(safe-area-inset-bottom)); z-index: 51; transform: translateY(100%); transition: transform 0.3s ease-out; max-height: 90vh; overflow-y: auto; }
.sheet.open { transform: translateY(0); }
.sheet-drag { width: 36px; height: 5px; background: #444; border-radius: 3px; margin: 0 auto 20px; }
.sheet h2 { font-size: 20px; font-weight: 600; margin-bottom: 16px; color: var(--fg); }
.btn-primary { background: var(--brand); color: #fff; width: 100%; padding: 14px; border-radius: 8px; font-weight: 600; font-size: 16px; margin-top: 10px; }
.btn-secondary { background: transparent; border: 1px solid var(--mute); color: var(--fg); width: 100%; padding: 14px; border-radius: 8px; font-weight: 600; font-size: 16px; margin-top: 10px; }
</style>
</head>
<body>

<div id="app">
  <!-- MAIN HEADER -->
  <header class="header" id="main-header">
    <div class="logo">Bouncy</div>
    <div class="header-actions">
      <svg viewBox="0 0 24 24" onclick="openContacts()"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <svg viewBox="0 0 24 24" onclick="handleLogout()" style="stroke: #FF3B30;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
    </div>
  </header>

  <!-- CHAT LIST SCREEN -->
  <div id="chat-list-screen">
    <div id="chat-list-container">
      <div style="text-align: center; padding: 40px 20px; color: var(--mute);" id="empty-chats">
        No chats yet.<br>Tap the green button to find friends.
      </div>
    </div>
  </div>

  <!-- FLOATING ACTION BUTTON (NEW CHAT) -->
  <button class="fab" onclick="openContacts()">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <!-- CHAT ROOM SCREEN -->
  <div id="chat-room-screen">
    <div class="chat-header">
      <button class="back-btn" onclick="closeChat()">←</button>
      <div class="avatar" id="chat-avatar" style="width: 36px; height: 36px; font-size: 16px;">U</div>
      <div class="chat-header-info">
        <div class="chat-header-name" id="chat-name">User</div>
        <div class="chat-header-status">online</div>
      </div>
    </div>
    
    <div class="messages-area" id="messages-area"></div>
    
    <div class="input-area">
      <input type="text" id="message-input" placeholder="Message" onkeypress="handleEnter(event)" />
      <button class="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- MODALS -->
<div class="sheet-overlay" id="sheet-overlay" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-drag"></div>
  <div id="sheet-content"></div>
</div>

<script>
const SUPABASE_URL = 'https://lakupnehsetdazezlsrs.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_3ePLMRIKVNms7Qi461FQXw_x2TGc75s';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let activeChatUser = null; // The person you are currently talking to
let realtimeChannel = null;
let allUsers = [];

// --- INIT ---
window.addEventListener('load', async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    currentUser = session.user;
    initApp();
  } else {
    showAuthSheet();
  }
});

// --- AUTH ---
function showAuthSheet() {
  document.getElementById('main-header').classList.add('hide');
  const content = document.getElementById('sheet-content');
  content.innerHTML = `
    <h2>Log in to Bouncy Chat</h2>
    <input type="email" id="auth-email" placeholder="Email" style="margin-bottom: 12px;" />
    <input type="password" id="auth-password" placeholder="Password" style="margin-bottom: 12px;" />
    <p id="auth-error" style="color: #FF3B30; font-size: 13px; margin-bottom: 10px; display: none;"></p>
    <button class="btn-primary" onclick="handleLogin()">Log In</button>
    <button class="btn-secondary" onclick="handleSignUp()">Create Account</button>
  `;
  document.getElementById('sheet-overlay').classList.add('open');
  document.getElementById('sheet').classList.add('open');
}

async function handleLogin() {
  const email = document.getElementById('auth-email').value;
  const password = document.getElementById('auth-password').value;
  const err = document.getElementById('auth-error');
  err.style.display = 'none';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { err.textContent = error.message; err.style.display = 'block'; } 
  else { currentUser = data.user; closeSheet(); initApp(); }
}

async function handleSignUp() {
  const email = document.getElementById('auth-email').value;
  const password = document.getElementById('auth-password').value;
  const err = document.getElementById('auth-error');
  err.style.display = 'none';
  const { data, error } = await sb.auth.signUp({ email, password });
  if (error) { err.textContent = error.message; err.style.display = 'block'; } 
  else {
    if(data.session) { currentUser = data.user; closeSheet(); initApp(); } 
    else { err.textContent = "Check your email to confirm your account!"; err.style.display = 'block'; }
  }
}

async function handleLogout() { await sb.auth.signOut(); window.location.reload(); }

// --- APP LOGIC ---
async function initApp() {
  document.getElementById('main-header').classList.remove('hide');
  await fetchAllUsers();
  await loadRecentChats();
  subscribeToGlobalMessages();
}

async function fetchAllUsers() {
  const { data } = await sb.from('profiles').select('id, username').neq('id', currentUser.id);
  if (data) allUsers = data;
}

function openContacts() {
  const content = document.getElementById('sheet-content');
  content.innerHTML = `<h2>Select a contact</h2><div id="contacts-list"></div>`;
  
  const list = document.getElementById('contacts-list');
  if (allUsers.length === 0) {
    list.innerHTML = '<p style="color:var(--mute);">No other users found. Tell a friend to sign up!</p>';
  } else {
    allUsers.forEach(u => {
      const div = document.createElement('div');
      div.className = 'chat-item';
      div.innerHTML = `
        <div class="avatar">${u.username[0].toUpperCase()}</div>
        <div class="chat-info" style="border:none;"><div class="chat-name">@${u.username}</div></div>
      `;
      div.onclick = () => { closeSheet(); openChat(u.id, u.username); };
      list.appendChild(div);
    });
  }
  
  document.getElementById('sheet-overlay').classList.add('open');
  document.getElementById('sheet').classList.add('open');
}

// --- LOAD CHATS ---
async function loadRecentChats() {
  // Fetch all messages involving the current user
  const { data: messages, error } = await sb
    .from('direct_messages')
    .select('*')
    .or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`)
    .order('created_at', { ascending: false });

  const container = document.getElementById('chat-list-container');
  if (!messages || messages.length === 0) {
    container.innerHTML = '<div style="text-align: center; padding: 40px 20px; color: var(--mute);" id="empty-chats">No chats yet.<br>Tap the green button to find friends.</div>';
    return;
  }

  // Group by unique contact
  const chatsMap = new Map();
  messages.forEach(msg => {
    const otherId = msg.sender_id === currentUser.id ? msg.receiver_id : msg.sender_id;
    if (!chatsMap.has(otherId)) {
      chatsMap.set(otherId, msg);
    }
  });

  container.innerHTML = '';
  chatsMap.forEach((lastMsg, otherId) => {
    const user = allUsers.find(u => u.id === otherId) || { username: 'Unknown User' };
    const isMine = lastMsg.sender_id === currentUser.id;
    const preview = (isMine ? 'You: ' : '') + lastMsg.content;

    const div = document.createElement('div');
    div.className = 'chat-item';
    div.innerHTML = `
      <div class="avatar">${user.username[0].toUpperCase()}</div>
      <div class="chat-info">
        <div class="chat-name">@${user.username}</div>
        <div class="chat-preview">${preview}</div>
      </div>
    `;
    div.onclick = () => openChat(otherId, user.username);
    container.appendChild(div);
  });
}

// --- CHAT ROOM ---
async function openChat(userId, username) {
  activeChatUser = { id: userId, username: username };
  
  document.getElementById('chat-avatar').textContent = username[0].toUpperCase();
  document.getElementById('chat-name').textContent = '@' + username;
  document.getElementById('chat-room-screen').classList.add('open');
  document.getElementById('message-input').value = '';
  
  await loadMessagesForChat(userId);
}

function closeChat() {
  document.getElementById('chat-room-screen').classList.remove('open');
  activeChatUser = null;
  loadRecentChats(); // Refresh the list
}

async function loadMessagesForChat(otherId) {
  const area = document.getElementById('messages-area');
  area.innerHTML = '<div style="text-align:center; color:var(--mute); font-size:13px;">Loading messages...</div>';
  
  const { data: msgs } = await sb
    .from('direct_messages')
    .select('*')
    .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${otherId}),and(sender_id.eq.${otherId},receiver_id.eq.${currentUser.id})`)
    .order('created_at', { ascending: true });

  area.innerHTML = '';
  if (!msgs || msgs.length === 0) {
    area.innerHTML = '<div style="text-align:center; color:var(--mute); font-size:13px; margin-top:20px;">No messages here yet.<br>Say hello!</div>';
    return;
  }

  msgs.forEach(msg => appendMessageBubble(msg));
  scrollToBottom();
}

function appendMessageBubble(msg) {
  const area = document.getElementById('messages-area');
  const isMe = msg.sender_id === currentUser.id;
  
  const time = new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
  
  const div = document.createElement('div');
  div.className = `msg ${isMe ? 'sent' : 'received'}`;
  div.innerHTML = `
    <div>${msg.content}</div>
    <div class="msg-time">${time} ${isMe ? '✓✓' : ''}</div>
  `;
  area.appendChild(div);
}

function scrollToBottom() {
  const area = document.getElementById('messages-area');
  area.scrollTop = area.scrollHeight;
}

function handleEnter(e) { if (e.key === 'Enter') sendMessage(); }

async function sendMessage() {
  const input = document.getElementById('message-input');
  const text = input.value.trim();
  if (!text || !activeChatUser) return;

  input.value = ''; // Clear immediately

  // Optimistically add to screen
  const tempMsg = { sender_id: currentUser.id, content: text, created_at: new Date().toISOString() };
  appendMessageBubble(tempMsg);
  scrollToBottom();

  // Insert into Database
  const { error } = await sb.from('direct_messages').insert([{
    sender_id: currentUser.id,
    receiver_id: activeChatUser.id,
    content: text
  }]);

  if (error) {
    alert("Failed to send: " + error.message);
  }
}

// --- REAL-TIME LISTENER ---
function subscribeToGlobalMessages() {
  if (realtimeChannel) sb.removeChannel(realtimeChannel);
  
  realtimeChannel = sb.channel('global-chat')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'direct_messages' }, payload => {
      const newMsg = payload.new;
      
      // Is it for me or from me?
      const isForMe = newMsg.receiver_id === currentUser.id;
      const isFromMe = newMsg.sender_id === currentUser.id;
      
      if (!isForMe && !isFromMe) return; // Not our chat

      // 1. If we are currently inside this chat room
      if (activeChatUser) {
        const isCurrentChat = (newMsg.sender_id === activeChatUser.id && isForMe) || 
                              (newMsg.receiver_id === activeChatUser.id && isFromMe);
        
        if (isCurrentChat) {
          // Only append if we didn't just send it (to avoid duplicates)
          // The quick way is to just reload the messages, but appending is smoother
          appendMessageBubble(newMsg);
          scrollToBottom();
          return;
        }
      }
      
      // 2. If we are on the chat list, refresh the list
      if (!activeChatUser) {
        loadRecentChats();
      }
    })
    .subscribe();
}

// --- UTILS ---
function closeSheet() {
  document.getElementById('sheet-overlay').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
}
</script>
</body>
</html>
